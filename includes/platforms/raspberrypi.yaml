# Raspberry Pi common configuration for AutonomOS
# Include this for all Raspberry Pi platforms, then include the machine-specific file.
header:
  version: 20

repos:
  meta-raspberrypi:
    url: "https://github.com/agherzan/meta-raspberrypi.git"
    commit: 6ca1f75017cc5d5acdb8bb05634c4bc01fa049fd
    path: "sources/meta-raspberrypi"

  meta-lts-mixins:
    url: https://git.yoctoproject.org/meta-lts-mixins
    # Workaround for U-Boot patch incompatibility with raspberrypi layer
    branch: scarthgap/u-boot
    commit: a44882db02a0ed0f149371831bfbe067665eb42b
    path: "sources/meta-lts-mixins"

  meta-rauc-community:
    url: "https://github.com/rauc/meta-rauc-community.git"
    commit: 222c61275054974cdbd09bd5faa2b7a37ddbd840
    path: "sources/meta-rauc-community"
    branch: scarthgap
    layers:
      meta-rauc-raspberrypi:

  # Add the Raspberry Pi platform layer. kas merges repo dictionaries across
  # include files, so this enables a second layer inside the meta-autonomos repo
  # that includes/base.yaml declares and pins.
  meta-autonomos:
    layers:
      meta-autonomos-raspberrypi:

local_conf_header:
  raspberrypi: |
    RPI_USE_U_BOOT = "1"
    ENABLE_UART = "1"
    # No serial (no adapter, and the kiosk panel is the console) and no
    # bluetooth (nothing pairs). Upstream rpi-base.inc re-adds both, plus
    # alsa and touchscreen, so the kiosk config also carries a :remove.
    MACHINE_FEATURES:append = " wifi"
    IMAGE_INSTALL:append = " kernel-image kernel-devicetree packagegroup-autonomos-raspberrypi"
    IMAGE_FSTYPES:remove = " rpi-sdimg"
    LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

  rauc-wks: |
    WKS_FILE = "autonomos-dual-raspberrypi.wks.in"
    IMAGE_FSTYPES:append = " wic wic.bz2 wic.bmap ext4"
