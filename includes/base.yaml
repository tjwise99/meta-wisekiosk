##########
# HEADER #
##########
header:
  version: 20
  includes:
    - includes/rauc.yaml

############
# DEFAULTS #
############
defaults:
  repos:
    branch: scarthgap

##################
# REPOS & LAYERS #
##################
# Every repo is pinned by commit. Floating on branch heads makes any manifest
# difference unattributable -- a rebuild would mix "what we changed" with "what
# upstream pushed since". Bumping a pin is an edit here, reviewed like any
# other; `just currency` reports which have fallen behind and
# docs/layers-and-kas.md holds the procedure.
repos:
  # No url: kas resolves this to the repository containing this config file.
  # meta-wisekiosk LAYERDEPENDS on the Raspberry Pi layers, so this file is not
  # usable alone -- it expects a platform include from includes/platforms/.
  meta-wisekiosk:
    layers:
      meta-wisekiosk:

  # Upstream, consumed as a dependency instead of forked. Pinned at its tip
  # (dormant since 2026-01-20). patches/ carries the two changes that cannot
  # be expressed from a downstream layer -- see patches/meta-autonomos/.
  meta-autonomos:
    url: "https://github.com/jsmith212/meta-autonomos.git"
    branch: main
    commit: 1fd4eb55c2ef0902176986bb0dea90e7c34d02bf
    path: "sources/meta-autonomos"
    layers:
      meta-autonomos-core:
    patches:
      01-graphics:
        repo: meta-wisekiosk
        path: "patches/meta-autonomos/0001-distro-make-graphics-strip-conditional.patch"
      02-wpa:
        repo: meta-wisekiosk
        path: "patches/meta-autonomos/0002-wpa-supplicant-stop-baking-credentials.patch"

  poky:
    url: "https://git.yoctoproject.org/git/poky"
    commit: 69ae79bf5a01a24491648e2fdea6faf51aeb3bf2
    path: "sources/poky"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  # https, not git://: git.openembedded.org and git.yoctoproject.org sit behind
  # Cloudflare, which refuses port 9418.
  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    commit: bec755063a8b5da65df626f5749496aadaa4f4bb
    path: "sources/meta-openembedded"
    layers:
      meta-oe:
      meta-filesystems:
      meta-networking:
      meta-python:

  meta-arm:
    url: "https://git.yoctoproject.org/meta-arm"
    commit: 045eb74bd9abe7d9ccf365a2417e440ce83bcbb0
    path: "sources/meta-arm"
    layers:
      meta-arm-toolchain:
      meta-arm:

  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"
    commit: f980aefbc8b3eeafb8d144e7fdac3c3b701a4fea
    path: "sources/meta-virtualization"

  # GOVERSION = "1.26%" for the backend; poky scarthgap ships Go 1.22.12.
  # A second checkout of meta-lts-mixins, which carries one topic per branch --
  # includes/platforms/raspberrypi.yaml pins scarthgap/u-boot off the same url.
  meta-lts-mixins-go:
    url: "https://git.yoctoproject.org/meta-lts-mixins"
    branch: scarthgap/go
    commit: df1df57da4ee43ecf23413796531b8942d949963
    path: "sources/meta-lts-mixins-go"
