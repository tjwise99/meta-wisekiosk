##########
# HEADER #
##########
# Kiosk image for the Raspberry Pi Zero W: surf on WebKitGTK, no desktop, no
# window manager. See docs in the kiosk-reference project for the phase plan --
# Phase 0a is `bitbake webkitgtk3 surf`, which needs no image and no card.
header:
  version: 20
  includes:
    - includes/base.yaml
    - includes/platforms/raspberrypi-zero-w.yaml
    - secrets.yaml

##################
# REPOS & LAYERS #
##################
# base.yaml fetches these three over git://, which git.openembedded.org and
# git.yoctoproject.org no longer serve -- both now resolve to Cloudflare, which
# fronts HTTP/HTTPS only and refuses port 9418. Branch pins from base.yaml are
# inherited; only the URL changes here.
repos:
  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"

  meta-arm:
    url: "https://git.yoctoproject.org/meta-arm"

  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"

##########
# TARGET #
##########
build_system: oe
distro: autonomos
target: core-image-base

#######################
# BUILD CONFIGURATION #
#######################
local_conf_header:
  standard: |
    PATCHRESOLVE = "noop"
    CONF_VERSION = "2"
    USER_CLASSES ?= "buildstats"
    TMPDIR = "${TOPDIR}/tmp-${MACHINE}"

  extras: |
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks"

  kiosk: |
    AUTONOMOS_FEATURES = "graphics"
    PACKAGECONFIG:remove:pn-webkitgtk3 = "jit gtk4"
    PACKAGECONFIG:append:pn-webkitgtk3 = " reduce-size"
    IMAGE_INSTALL:append = " surf packagegroup-core-x11 xwininfo xprop ttf-roboto fbgrab"

  # Nothing here runs a Wayland compositor, VC4 has no Vulkan, and ptest builds
  # test suites for a board that will never run them. Removing them is free
  # before the first build and costs a rebuild after it.
  trim: |
    DISTRO_FEATURES:remove = " wayland vulkan ptest"

  # WebKit's link step wants several GB per linker process. The host has ~7.7GB,
  # so cpu_count() parallelism OOMs hours into the build. The fixed caps are a
  # floor; BB_PRESSURE_MAX_MEMORY is the part that adapts -- bitbake stops
  # launching new tasks when the kernel reports memory stall above the threshold
  # (microseconds of stall per second; 1000000 would never trigger).
  parallel: |
    BB_NUMBER_THREADS = "6"
    PARALLEL_MAKE = "-j6"
    PARALLEL_MAKE:pn-webkitgtk3 = "-j6"
    BB_PRESSURE_MAX_MEMORY = "20000"

  diskmonitoring: |
    BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"
