##########
# HEADER #
##########
# Kiosk image for the Raspberry Pi Zero W: surf on WebKitGTK, no desktop, no
# window manager. This is the only kas config in the repo; it pulls in the repo
# pins (includes/base.yaml, which fetches meta-autonomos and patches it) and the
# machine, then adds everything specific to this image below.
header:
  version: 20
  includes:
    - includes/base.yaml
    - includes/platforms/raspberrypi-zero-w.yaml

##########
# TARGET #
##########
build_system: oe
distro: autonomos
target: core-image-base

#######################
# BUILD CONFIGURATION #
#######################
local_conf_header:
  standard: |
    PATCHRESOLVE = "noop"
    CONF_VERSION = "2"
    USER_CLASSES ?= "buildstats"
    TMPDIR = "${TOPDIR}/tmp-${MACHINE}"

  # debug-tweaks gives an empty root password and permits root SSH login. That
  # is the lifeline: booting this card means a physical trip to the kiosk, and
  # an image you cannot log into is recovered only by pulling the card back out.
  # ssh-server-openssh is NOT implied by core-image-base -- its only IMAGE_FEATURE
  # is splash, which is dropped here because plymouth measured 2.6s of boot on
  # this hardware for a screen nobody watches.
  extras: |
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks ssh-server-openssh"
    IMAGE_FEATURES:remove = "splash"

  # A kernel panic at 4.0s inside mmc_rescan was observed 2026-08-12 and hung the
  # board indefinitely. Nothing in userspace can reach a panic that early: systemd
  # arms the hardware watchdog at 5.2s, and kernel.panic via sysctl applies at
  # ~11.7s. The kernel command line is the only mechanism that covers it, and
  # without it this failure costs a person standing at the device.
  panic-reboot: |
    CMDLINE:append = " panic=10"

  # The live kiosk runs the legacy fbdev path, not vc4 KMS -- gldriver_test.sh
  # installs 99-fbturbo.conf there because v3d is not "okay" on this board. KMS
  # would also ignore the firmware HDMI settings above, replacing a display path
  # that demonstrably works with one that is untested. Nothing here needs GL:
  # the launcher sets GDK_GL=disable, as the Raspbian kiosk does.
  display: |
    DISABLE_VC4GRAPHICS = "1"

    # console=tty1 ONLY. The kiosk panel is the console (owner, 2026-08-12) --
    # this unit IS a display, so kernel output always has a screen, and there is
    # no serial adapter and will not be one. The 4.0s mmc_rescan panic was read
    # off that panel.
    #
    # Carrying console=serial0 as well cost 2.43s of wall clock for 0.43s of CPU,
    # measured n=3: every printk is written SYNCHRONOUSLY to a 115200 UART, so
    # the core stalls on it rather than computing. 261 kernel lines is ~19.6KB,
    # ~1.7s at that baud, and the measured cost is higher because early-boot
    # messages predate journald. "Expecting device wlan0" moved 7.7s -> 6.1s.
    #
    # ENABLE_UART is left alone deliberately: only the cmdline argument was
    # measured, and changing the firmware setting in config.txt is a different,
    # untested change.
    CMDLINE_SERIAL = "console=tty1"

  kiosk: |
    AUTONOMOS_FEATURES = "graphics"
    # enchant is spellcheck. There is no text input on this kiosk -- no keyboard,
    # no form, nothing focusable -- so it is a dictionary and two libraries
    # (enchant2, aspell) for a feature that cannot be reached. It is a real
    # PACKAGECONFIG, unlike gstreamer, which webkitgtk3 carries in its hard
    # DEPENDS and which therefore needs a bbappend plus cmake video/audio flags:
    # a different kind of change, deliberately not batched with this one.
    PACKAGECONFIG:remove:pn-webkitgtk3 = "jit gtk4 enchant"

    # iproute2-tc: ingress rate policing, so the board enforces its own receive
    # ceiling instead of trusting every sender. The kernel modules (sch_ingress,
    # act_police, sch_tbf, cls_u32) are already built in; only the binary was
    # missing. This MUST live here, not in autonomos-common.inc -- the kas target
    # is core-image-base, and that .inc is only included by autonomos-base.bb,
    # which is not built. The first attempt went there and silently shipped nothing.
    IMAGE_INSTALL:append = " iproute2-tc"

    # kiosk-cpufreq: caps scaling_max_freq below this board's unstable top OPP.
    # THE fix for the crash diagnosed 2026-08-13 -- 1000 MHz corrupts memory
    # under sustained SDIO + network load (2/2 deaths pinned there; 8/8
    # survivals at every OPP below, with the governor still switching). It ships
    # in the image specifically so it arrives by OTA: the config.txt
    # over_voltage route that upstream reports use lives on the shared FAT
    # partition and can never be delivered to a wall-mounted unit remotely.
    IMAGE_INSTALL:append = " kiosk-cpufreq"

    # ramoops: persistent RAM store, so a kernel panic survives the reset. This
    # is what finally captured the root cause. A userspace witness cannot see a
    # panic by construction -- after one, no userspace is ever scheduled again --
    # so no amount of fsync could ever have caught it.
    #
    # Both halves are needed and neither is a default: the overlay is absent
    # from meta-raspberrypi's 70-entry whitelist, and the stock overlay ships
    # console-size=0, which disables the one zone that carries the log tail.
    #
    # NOTE: this reaches the device only on a CARD REFLASH. config.txt and the
    # overlays live on the shared FAT partition, which RAUC never touches
    # (RAUC_BUNDLE_SLOTS = "rootfs"). The running unit already has both, hand
    # installed 2026-08-13; this exists so a rebuilt card is not silently worse
    # than the unit in the field.
    RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/ramoops.dtbo"
    RPI_EXTRA_CONFIG:append = "\ndtoverlay=ramoops,total-size=0x40000,record-size=0x8000,console-size=0x20000\n"
    PACKAGECONFIG:append:pn-webkitgtk3 = " reduce-size"
    IMAGE_INSTALL:append = " surf kiosk-session kiosk-soak kiosk-journal kiosk-hardware kiosk-netcheck kiosk-bootprof zram wpa-supplicant-service packagegroup-core-x11 xwininfo xprop ttf-roboto imagemagick tzdata-core tzdata-americas"

    # serial-getty is a login prompt on a port with nothing attached, started at
    # 25.4s -- before the wlan0 gate.
    #
    # SERIAL_CONSOLES = "", not PACKAGE_EXCLUDE: packagegroup-core-boot RDEPENDS
    # on systemd-serialgetty, so excluding the package fails do_rootfs with
    # "conflicting requests". systemd-serialgetty.bb wraps its whole do_install
    # in `if [ ! -z "${SERIAL_CONSOLES}" ]` and sets ALLOW_EMPTY, so an empty
    # value yields a present-but-empty package: the dependency is satisfied and
    # no units are installed.
    #
    # It is also cheap. systemd-serialgetty is its OWN recipe, not part of
    # systemd, and is PACKAGE_ARCH = MACHINE_ARCH -- so this re-hashes one small
    # recipe rather than dragging webkitgtk3 into a rebuild.
    SERIAL_CONSOLES = ""

    # core-image-base ships no tzdata at all, so the first boot ran in UTC and
    # the kiosk clock was four hours out. A runtime fix does not survive an OTA
    # update -- A/B replaces the whole rootfs slot -- so it belongs here.
    DEFAULT_TIMEZONE = "America/New_York"

    # Journal persistence is the kiosk-journal recipe, not VOLATILE_LOG_DIR.
    # That variable is read by systemd's do_install, so setting it re-hashes
    # systemd -> gtk+3/at-spi2-core -> webkitgtk3, costing a multi-hour WebKit
    # rebuild. It also puts the journal on the rootfs slot, which an A/B update
    # replaces -- destroying the logs of the boot that failed.
    # hostname is NOT baked. It is site configuration; kiosk-provision sets it
    # from /data/config/hostname at boot.

    # machine-id is NOT baked -- a fixed id in the image gives every unit the
    # same identity, and systemd derives the networkd DUID from it. It is
    # per-device: written into each new slot by the RAUC post-install hook, and
    # into a fresh card by provisioning. journald reads it at ~8.2s, before
    # /data is mounted, which is why it must be in the rootfs rather than read
    # from /data at boot.

    # systemd-resolved answered zero queries and cost ~729ms before the gate, to
    # write one file. Masked in kiosk-hardware; this writes the static
    # /etc/resolv.conf that replaces it. Measured -1.03s at basic.target, n=3,
    # ranges not overlapping, with DNS still resolving. The nameserver itself is
    # NOT baked -- /etc/resolv.conf is a symlink into /data/config, written by
    # provisioning.
    INHERIT += "kiosk-static-resolv"

  # update-bundle.bb packages whichever image RAUC_SLOT_rootfs names, and its
  # default is autonomos-devel -- a different image, with no surf and no kiosk
  # unit. Installing that bundle would replace the slot and report success.
  # The :pn- form is required, not stylistic: update-bundle.bb assigns both of
  # these with a plain "=", which beats a bare local.conf value, so the override
  # is applied after the recipe parses or it is silently discarded.
  rauc: |
    RAUC_SLOT_rootfs:pn-update-bundle = "core-image-base"

    # Tier 1 -- scp the .raucb, then rauc install -- is the fallback every later
    # delivery tier rests on, so it is what the first bundle has to be. casync
    # buys bandwidth that a LAN against a local mirror does not need, and adds a
    # convert step that can fail after the image itself is already built.
    RAUC_CASYNC_BUNDLE:pn-update-bundle = "0"

  # Nothing here runs a Wayland compositor, VC4 has no Vulkan, and ptest builds
  # test suites for a board that will never run them. Removing them is free
  # before the first build and costs a rebuild after it.
  trim: |
    # bluetooth is removed from DISTRO_FEATURES as well as MACHINE_FEATURES
    # because packagegroup-base.bb pulls packagegroup-base-bluetooth on
    # DISTRO_FEATURES alone (line 28), not just COMBINED_FEATURES. Removing it
    # from MACHINE_FEATURES only was measured and did NOT drop bluez5,
    # pi-bluetooth or the BT firmware from the image.
    #
    # alsa and touchscreen are deliberately NOT removed from DISTRO_FEATURES:
    # both are keyed on MACHINE_FEATURES/COMBINED_FEATURES, so the machine-side
    # removal is sufficient, and touching DISTRO_FEATURES risks re-hashing
    # gstreamer -> webkitgtk3 into a multi-hour rebuild for no extra benefit.
    DISTRO_FEATURES:remove = " wayland vulkan ptest bluetooth"

    # Nothing on this kiosk pairs, scans or streams; the only link is WiFi
    # (owner, 2026-08-12). rpi-base.inc adds bluetooth to MACHINE_FEATURES, which
    # pulls packagegroup-base-bluetooth -> bluez5, pi-bluetooth and the BT
    # firmware, and pi-bluetooth ships 90-pi-bluetooth.rules -- the udev rule
    # that instantiates bthelper@hci0 on every boot at 34.5s.
    #
    # Measured on the device: bluetooth + hciuart + bthelper is 2.43s of boot CPU
    # and 4.2MB of RSS. It moves wlan0 by 0.00s because it runs after the gate,
    # so this buys headroom and image bytes rather than time.
    #
    # The BCM43430 is a combo part: this removes the BT firmware patch
    # (BCM43430A1.hcd), NOT the WiFi firmware (brcmfmac43430-sdio), which comes
    # from the wifi feature. Verify brcmfmac firmware survives before flashing --
    # it is the lifeline.
    # Nothing pairs, nothing plays audio, there is no touchscreen behind the
    # glass, and there is no serial adapter. rpi-base.inc:125 adds all of these
    # unconditionally, so they are stripped here rather than at the platform
    # include (which only controls this project's own append).
    #
    # keyboard and usbhost are deliberately KEPT: a USB keyboard on tty1 is the
    # only way into this device if the network is gone, and the panel is the
    # console.
    MACHINE_FEATURES:remove = "bluetooth alsa touchscreen serial"

    # busybox syslogd + klogd duplicate journald onto the SD card, and klogd
    # re-injects the entire kernel ring buffer into the journal a second time --
    # visible as a burst of kernel[NNN] lines replaying earlier timestamps.
    # 181ms of boot CPU between them, before the gate, for records journald
    # already holds. journald stays: it is the only evidence channel this
    # device has, and the network hang destroys its own logs.
    VIRTUAL-RUNTIME_base-utils-syslog = ""

    # raspberrypi0-wifi.conf:11 pulls the BT firmware blob through
    # MACHINE_EXTRA_RRECOMMENDS, independently of MACHINE_FEATURES, so removing
    # the feature drops bluez5 and pi-bluetooth but leaves BCM43430A1.hcd behind.
    # Inert once hciuart and bluez are gone, but it is bytes for nothing.
    MACHINE_EXTRA_RRECOMMENDS:remove = "bluez-firmware-rpidistro-bcm43430a1-hcd"

    # A hardware database for matching peripherals, on a board that has none:
    # /sys/class/sound empty, no video4linux, no DRM card, no input devices, no
    # USB devices. hwdb.bin alone is 10.9MB of a 20MB /usr/lib/udev, measured on
    # the device.
    #
    # Bytes only -- do NOT expect boot time. An earlier draft put udevd's cost at
    # 7.88s of "walking the module set"; measured cold, a hwdb query is ~30ms
    # above the process floor, because it is an mmap'd trie and a lookup touches
    # a few pages. udevd's real cost is rule processing over device events.
    #
    # It arrives as an RRECOMMENDS of systemd, so BAD_RECOMMENDATIONS is the
    # lever -- no bbappend, and therefore no systemd re-hash.
    BAD_RECOMMENDATIONS += "udev-hwdb"

    # tzdata is a metapackage RDEPENDing on every region; tzdata-americas does
    # NOT pull tzdata-core, so both are named above. /usr/share/zoneinfo is 7.4MB
    # on the device for one fixed site that reads only America/New_York.
    #
    # This kiosk renders one language. 22 locale packages ship, including
    # en-gb, for 2.9MB of /usr/lib/locale.
    IMAGE_LINGUAS = "en-us"

  # WebKit's link step wants several GB per linker process. The host has ~7.7GB,
  # so cpu_count() parallelism OOMs hours into the build. The fixed caps are a
  # floor; BB_PRESSURE_MAX_MEMORY is the part that adapts -- bitbake stops
  # launching new tasks when the kernel reports memory stall above the threshold
  # (microseconds of stall per second; 1000000 would never trigger).
  parallel: |
    BB_NUMBER_THREADS = "6"
    PARALLEL_MAKE = "-j6"
    # webkitgtk3 translation units peak at 1.0-1.3 GB of compiler RSS. At -j6 on a
    # 12 GB host this swapped 22 million pages and ran the compilers at ~8% CPU
    # efficiency -- one source file accumulated 3h45m of wall time for 19 min of
    # CPU, and the build managed 64 ninja edges in 50 minutes. -j2 is not a
    # throttle, it is the setting that finishes first.
    PARALLEL_MAKE:pn-webkitgtk3 = "-j2"
    BB_PRESSURE_MAX_MEMORY = "20000"

  diskmonitoring: |
    BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"
