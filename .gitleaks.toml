[extend]
useDefault = true

# One known finding is allowlisted so CI gates NEW leaks; a check that is red on
# every run gates nothing.
#
# Not a false positive: development.key.pem is a genuine RSA private key in a
# PUBLIC repository, from the upstream AutonomOS tree (c2d73ed3, 2026-01-04), not
# the Zero W port. Its reach is nil -- fleet and build both use the WiseKiosk 2026
# key (kiosk-zero-w.yaml, AUTONOMOS_RAUC_KEY_DIR), so a bundle signed with the dev
# key installs nowhere. See docs/rauc-key-rotation.md.
#
# The entry stays while the file remains in the upstream tree: rewriting history
# does not unpublish an already-public key.
[allowlist]
description = "Retired upstream RAUC development signing key, still present in-tree"
paths = ['''meta-autonomos-core/files/rauc-example-keys/development\.key\.pem''']
