[extend]
useDefault = true

# One known finding is allowlisted here so that CI gates NEW leaks. A check that
# is red on every run gets ignored, and then it gates nothing at all.
#
# This is NOT a statement that the finding is a false positive. development.key.pem
# is a genuine RSA private key in a PUBLIC repository, and it arrived with the
# upstream AutonomOS tree (c2d73ed3, 2026-01-04) rather than with the Zero W port.
#
# Its REACH is gone: the fleet was rotated onto the WiseKiosk 2026 key, no device
# trusts development.cert.pem any longer, and the build signs with and bakes only
# the rotated key (kiosk-zero-w.yaml, AUTONOMOS_RAUC_KEY_DIR). A bundle signed
# with this key installs nowhere. See docs/rauc-key-rotation.md.
#
# The allowlist entry stays because the file is still in the tree and in history,
# and rewriting history does not unpublish an already-public key. It goes when the
# file leaves the upstream tree, not before.
[allowlist]
description = "Retired upstream RAUC development signing key, still present in-tree"
paths = ['''meta-autonomos-core/files/rauc-example-keys/development\.key\.pem''']
