name: guards

# A Yocto build is hours and cannot gate a commit. What CAN gate a commit is
# whether this public repository is about to publish something it should not,
# and whether the files a build reads still parse.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks detect scans history, not the worktree. A shallow clone
          # would scan almost nothing and pass for the wrong reason.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Run repository guards
        run: tools/ci-guards.sh

      # Pure stdlib, no install step. tools/doc-image.py is deliberately NOT
      # here: it compares prose against a built rootfs, CI never builds one, and
      # a required check that skips on every run is noise, not a gate.
      #
      # !cancelled(): this runs even when the guards step failed, matching the
      # hook and `just verify` -- two independent findings are worth more than
      # the first one twice. The job still fails if either step does, and unlike
      # always() a cancelled run stays cancelled.
      - name: Check Markdown cross-references
        if: ${{ !cancelled() }}
        run: python3 tools/doc-links.py

      # The half gitleaks and the guards' IP check structurally cannot see: a
      # hostname, an SSID, a MAC, a board serial, a machine-id. Its own step so
      # a failure names the identity scan rather than "guards", and so it runs
      # even when an earlier step failed. The known-value half reads gitignored
      # local/device-identity.md, which no clone has, so a run here is the
      # pattern half and says so -- it reports PARTIAL, never "clean".
      # ci-guards guard 11 asserts this step still exists.
      - name: Scan for device identity
        if: ${{ !cancelled() }}
        run: tools/scrub-identity.py --check
