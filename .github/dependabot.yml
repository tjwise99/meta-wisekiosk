version: 2

# Dependabot manages the one dependency surface GitHub can parse here: the
# Actions this repo's workflows call. It does NOT and cannot see the toolchain
# that builds the image. The build runs inside a container via kas-container,
# whose version is pinned by hand in the README, and the Yocto layer SRCREVs --
# poky, meta-openembedded, meta-arm, meta-autonomos -- live as git revisions in
# includes/base.yaml, updated by hand against upstream. A green Dependabot here
# is not a claim that the build inputs are current.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
    groups:
      # Batch the routine bumps into one reviewable PR; let a major (a
      # potentially breaking action upgrade) arrive on its own.
      actions-minor:
        update-types:
          - minor
          - patch
