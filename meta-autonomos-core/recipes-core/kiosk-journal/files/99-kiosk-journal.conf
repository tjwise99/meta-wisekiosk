# The journal lives on /data so it survives an A/B update: RAUC replaces the
# whole rootfs slot, so a journal on the rootfs is destroyed by the very update
# whose failure it would explain.
# L takes exactly Type Path Mode User Group Age Argument -- four dashes before
# the target, not five. A fifth dash is parsed as Age and the target becomes
# "- /data/log/journal": a broken symlink, journald silently falls back to /run,
# and the journal is volatile again while the config looks correct. Caught on
# hardware by reading the symlink back, not by inspecting this file.
d /data/log         0755 root root            - -
d /data/log/journal 2755 root systemd-journal - -
L /var/log/journal  -    -    -               - /data/log/journal
