[Manager]
# BCM2835 watchdog hardware caps at ~15s; systemd pings at half this interval.
# Arms /dev/watchdog0 so a wedged kernel resets the board instead of hanging
# until someone pulls the power.
RuntimeWatchdogSec=14
# systemd closes the watchdog during shutdown and re-arms it under these. The
# default reboot window is 10 minutes, which is a 10-minute hole every reboot.
RebootWatchdogSec=30s
ShutdownWatchdogSec=30s
