[Unit]
# The unit has no ordering of its own, so it can fire before brcmfmac has
# created wlan0. wpa_supplicant then exits immediately, and with Type=forking
# and no Restart it never tries again -- that boot has no network, and on a
# board reachable only over wifi, no way in either.
Wants=sys-subsystem-net-devices-wlan0.device
After=sys-subsystem-net-devices-wlan0.device

[Service]
Restart=on-failure
RestartSec=5
