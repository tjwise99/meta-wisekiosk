# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "wisekiosk"
BBFILE_PATTERN_wisekiosk = "^${LAYERDIR}/"
# Above autonomos-core (6) and autonomos-raspberrypi (7): where both layers
# carry a bbappend for the same recipe, this layer's files win FILESPATH.
BBFILE_PRIORITY_wisekiosk = "10"

LAYERDEPENDS_wisekiosk = " \
    core \
    openembedded-layer \
    raspberrypi \
    rauc \
    autonomos-core \
    autonomos-raspberrypi"

LAYERSERIES_COMPAT_wisekiosk = "scarthgap"
