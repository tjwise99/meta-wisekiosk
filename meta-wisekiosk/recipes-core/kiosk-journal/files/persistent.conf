[Journal]
Storage=persistent

# Cap loosely, keep the working set small. The flush at ~25s scales with CURRENT
# journal size and lands before the wlan0 gate: at 77-81MB it cost 1.91-2.02s, at
# 19-21MB it costs 1.12-1.20s.
#
# The cap must stay well above the working set. journald dropped pre-flush
# early-boot entries twice on 2026-08-12 -- once at the 47.9MB default and again
# at a 32MB cap with 31MB in use. The failure is no free space, not a small cap.
SystemMaxUse=64M
SystemMaxFileSize=8M
