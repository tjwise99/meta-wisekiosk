# Keep the Raspberry Pi camera, ISP, codec and audio stack out of the boot.
#
# Measured 2026-08-12: udev loads this whole stack between ~21.3s and ~27.3s,
# immediately BEFORE brcmfmac binds to the WiFi chip -- which has been sitting
# on the SDIO bus since 4.0s. wlan0 does not appear until ~32.6s, and every
# unit downstream waits on it.
#
# All four leaves load with zero users (lsmod usage count 0). This kiosk has no
# camera and no audio. They pull in bcm2835_mmal_vchiq, videodev, videobuf2_*,
# v4l2_mem2mem, mc, vc_sm_cma, snd_pcm, snd_timer and snd behind them -- about
# 930 KB of resident module memory serving nothing.
#
# vc_sm_cma is used ONLY by bcm2835_isp and bcm2835_mmal_vchiq, not by the
# display: the kiosk renders through the legacy bcm2708_fb framebuffer, which
# the kernel command line configures directly.
#
# Class 1 -- reversible over SSH. Delete this file and reboot.
install bcm2835_isp /bin/true
install bcm2835_codec /bin/true
install bcm2835_v4l2 /bin/true
install snd_bcm2835 /bin/true

blacklist bcm2835_isp
blacklist bcm2835_codec
blacklist bcm2835_v4l2
blacklist snd_bcm2835

# Second pass, from the module first-seen timeline in kiosk-bootprof: these all
# load between cfg80211 (17.1s) and brcmfmac (28.1s), so they are ahead of the
# WiFi driver in udev's queue on a core that is 100% busy.
#
#   vc_sm_cma           survived the first blacklist with usage count 0 --
#                       something requests it directly rather than via the ISP
#   raspberrypi_gpiomem provides /dev/gpiomem; nothing on this kiosk uses GPIO
#   uio, uio_pdrv_genirq userspace-IO plumbing with no consumer here
#
# NOT included: drm / backlight / drm_panel_orientation_quirks. They load at
# 9.6s via modprobe@drm.service, well before the gate, and logind's seat setup
# may want DRM -- breaking X to save nothing is a bad trade.
install vc_sm_cma /bin/true
install raspberrypi_gpiomem /bin/true
install uio_pdrv_genirq /bin/true
install uio /bin/true

blacklist vc_sm_cma
blacklist raspberrypi_gpiomem
blacklist uio_pdrv_genirq
blacklist uio

# Third pass: the Bluetooth kernel side. bluez is gone as packages, but hci_uart
# still probes hci0 before basic.target and pulls in btbcm and the 557 KB
# bluetooth module, which pull ecdh_generic, libaes and ecc behind them -- then
# fail four firmware-patch lookups for a BCM43430A1.hcd that MACHINE_EXTRA_-
# RRECOMMENDS deliberately drops. hci_uart's usage count is 0.
#
# Measured n=3: modules loaded 22 -> 16, brcmfmac -0.37s (ranges do not
# overlap), surf exec -0.47s (non-overlapping by 0.01s -- believed real at
# ~0.45s, but thinner evidence than the other rows here, and stated as such).
#
# rfkill is NOT blacklisted. cfg80211 shares it, and cfg80211 is the lifeline.
install hci_uart /bin/true
install btbcm /bin/true
install bluetooth /bin/true

blacklist hci_uart
blacklist btbcm
blacklist bluetooth
