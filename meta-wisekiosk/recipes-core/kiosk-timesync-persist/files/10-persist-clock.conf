# Bind timesyncd's state dir onto /data so the saved clock survives an A/B update
# -- a cold slot otherwise fails a `rauc install` with "certificate is not yet
# valid" (issue #31). BindPaths, not a symlink: timesyncd runs ProtectSystem=strict,
# so a symlinked write outside its sandbox fails EROFS and is swallowed at
# log_debug. The leading `-` skips the bind (not a 226/NAMESPACE failure) when
# /data/systemd-timesync is missing, degrading to a non-persistent boot per the
# image's /data-degradation contract. The stager is a Wants= (not Requires=) for
# the same reason -- a failed stage must not cancel NTP -- and Wants= is what
# re-runs it on every timesyncd start; do not drop it as redundant with WantedBy=.
# Full rationale: docs/issue_investigation/clock_timesync/README.md.
[Unit]
Wants=kiosk-timesync-dir.service
After=kiosk-timesync-dir.service data.mount

[Service]
BindPaths=-/data/systemd-timesync:/var/lib/systemd/timesync
