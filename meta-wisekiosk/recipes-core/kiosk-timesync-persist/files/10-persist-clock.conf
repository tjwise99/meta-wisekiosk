# Persist timesyncd's clock to /data so a freshly installed slot boots with a
# real clock instead of the epoch -- the epoch-start is what fails a cold-boot
# `rauc install` with "certificate is not yet valid" (issue #31).
#
# BindPaths, not a symlink: the unit ships ProtectSystem=strict, which remounts
# the rootfs read-only inside its namespace. timesyncd WRITES its clock file
# (every SaveIntervalSec and at shutdown), and a write outside the sandbox's
# writable set fails EROFS -- which systemd swallows at log_debug. A bare symlink
# would be a silent no-op. BindPaths mounts /data over the state path read-write
# inside the namespace, so the write lands.
#
# The `-` prefix makes the bind skipped, not fatal, when /data/systemd-timesync is
# missing or unwritable -- without it that state fails timesyncd's namespace setup
# with 226/NAMESPACE. Together with Wants= (not Requires=) on the stager and
# After=data.mount ordering (not requiring) the mount, a degraded /data leaves
# timesyncd running non-persistent, per the image's /data-degradation contract,
# rather than leaving the board with no time source at all.
[Unit]
Wants=kiosk-timesync-dir.service
After=kiosk-timesync-dir.service data.mount

[Service]
BindPaths=-/data/systemd-timesync:/var/lib/systemd/timesync
